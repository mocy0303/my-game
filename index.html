const GROUND_H = 48;
const GROUND_Y = H - GROUND_H;
let camX = 0;

// Sparkles

  {x:300, y:GROUND_Y-70, w:100, h:16, color:'#ff88cc'},

const obstacles = [

// ── Player ─────────────────────────────────────
const CW=72, CH=88;
const p = {
  x:120, y:GROUND_Y, vx:0, vy:0,
  onGround:true, facing:1,
  bob:0, moving:false, running:false,
  state:'idle'
};

const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true; e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code]=false; });

// ── Physics ────────────────────────────────────
function getGroundAt(x, fallY) {
  // check platforms
  for (const pl of platforms) {
    if (x > pl.x && x < pl.x+pl.w && fallY >= pl.y && fallY <= pl.y+pl.h+8) {
      return pl.y;
    }
  }
  return GROUND_Y;
}

let lastT = 0;
function update(dt) {
  const run = keys['ShiftLeft']||keys['ShiftRight'];
  const spd = run ? 5.5 : 3;
  let mx=0, my=0;
  if(keys['KeyA']||keys['ArrowLeft'])  mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  if(keys['KeyW']||keys['ArrowUp'])    my-=1;
  if(keys['KeyS']||keys['ArrowDown'])  my+=1;

  p.moving = mx!==0||my!==0;
  p.running = p.moving&&run;
  if(mx!==0) p.facing = mx>0?1:-1;
  p.vx = mx*spd;
  if(p.onGround && my<0) p.y += my*spd*0.3;

  if((keys['Space'])&&p.onGround){ p.vy=-13; p.onGround=false; p.bob=0; }

  p.vy += 0.6;
  p.x  += p.vx;
  p.y  += p.vy;

  // ground collision
  const gnd = getGroundAt(p.x, p.y);
  if(p.y >= gnd){ p.y=gnd; p.vy=0; p.onGround=true; }

  // world bounds
  p.x = Math.max(CW/2, p.x);

  // camera follow
  camX = Math.max(0, p.x - W*0.35);

  // bob
  if(p.onGround&&p.moving) p.bob += dt*(run?0.016:0.009);
  else if(p.onGround)       p.bob += dt*0.002;

  // state
  if(!p.onGround) p.state='jump';
  else if(p.running) p.state='run';
  else if(p.moving) p.state='walk';
  else p.state='idle';

  const icons={idle:'♡',walk:'♪',run:'⚡',jump:'★'};
  st.textContent=(icons[p.state]||'♡')+' '+p.state.toUpperCase();
}

// ── Draw helpers ───────────────────────────────
function drawMushroom(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*4);
  // stem
  ctx.fillStyle='#ffe0cc';
  ctx.fillRect(-6,0,12,14);
  // cap
  ctx.fillStyle='#ff5577';
  ctx.beginPath(); ctx.ellipse(0,-4,13,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffffff88';
  ctx.beginPath(); ctx.ellipse(-4,-6,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-4,2,2,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawStar(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*3);
  ctx.fillStyle='#ffee44';
  ctx.rotate(Math.sin(t)*0.3);
  for(let i=0;i<5;i++){
    ctx.beginPath();
    const a=i*Math.PI*2/5-Math.PI/2;
    ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14);
    const a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a2)*6,Math.sin(a2)*6);
    const a3=a+Math.PI*2/5;
    ctx.lineTo(Math.cos(a3)*14,Math.sin(a3)*14);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawHeart(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*4);
  const s=1+Math.sin(t)*0.12;
  ctx.scale(s,s);
  ctx.fillStyle='#ff44aa';
  ctx.beginPath();
  ctx.moveTo(0,4);
  ctx.bezierCurveTo(-14,-8,-20,10,0,20);
  ctx.bezierCurveTo(20,10,14,-8,0,4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBG(t) {
  // gradient sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2d0a3e');
  g.addColorStop(0.5,'#4a1a5e');
  g.addColorStop(1,'#6a2a4e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // sparkles
  sparkles.forEach(s=>{
    s.phase+=s.spd;
    const sx=(s.x-camX*0.3)%W;
    const alpha=0.4+Math.sin(s.phase)*0.4;
    ctx.fillStyle=`rgba(255,200,230,${alpha})`;
    ctx.beginPath(); ctx.arc(sx<0?sx+W:sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // distant hills
  ctx.fillStyle='#3d1055';
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y-20);
  for(let x=0;x<=W;x+=40){
    const hx=(x+camX*0.5)%400;
    ctx.lineTo(x, GROUND_Y-20-Math.sin(hx/400*Math.PI*2)*35);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

  // platforms
  platforms.forEach(pl=>{
    const px=pl.x-camX;
    if(px>-pl.w-10&&px<W+10){
      // shadow
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(px+pl.w/2,pl.y+pl.h+4,pl.w/2,5,0,0,Math.PI*2); ctx.fill();
      // platform
      ctx.fillStyle=pl.color;
      ctx.beginPath(); ctx.roundRect(px,pl.y,pl.w,pl.h,6); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.roundRect(px+4,pl.y+2,pl.w-8,4,3); ctx.fill();
    }
  });

  // ground
  const gg=ctx.createLinearGradient(0,GROUND_Y,0,H);
  gg.addColorStop(0,'#ff99cc'); gg.addColorStop(1,'#cc5588');
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,W,GROUND_H);
  // ground sparkle pattern
  ctx.fillStyle='rgba(255,255,255,0.15)';
  for(let x=(-camX*0.8%40)-40;x<W;x+=40){
    ctx.beginPath(); ctx.ellipse(x,GROUND_Y+6,10,4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y+1); ctx.lineTo(W,GROUND_Y+1); ctx.stroke();

  // obstacles
  obstacles.forEach(ob=>{
    const ox=ob.x-camX;
    if(ox>-60&&ox<W+60){
      const ot=t*0.003+ob.phase;
      if(ob.type==='mushroom') drawMushroom(ox,ob.y,ot);
      else if(ob.type==='star') drawStar(ox,ob.y,ot);
      else drawHeart(ox,ob.y,ot);
    }
  });
}

function drawChar(t) {
  if(!img.complete||!img.naturalWidth) return;

  // shadow
  const gnd = getGroundAt(p.x, p.y);
  const dist = Math.max(0, gnd - p.y);
  const salpha = Math.max(0.05, 0.3 - dist*0.003);
  const sscale = Math.max(0.2, 1 - dist*0.006);
  ctx.save();
  ctx.fillStyle=`rgba(180,50,100,${salpha})`;
  ctx.beginPath();
  ctx.ellipse(p.x-camX, gnd+8, 28*sscale, 7*sscale, 0,0,Math.PI*2);
  ctx.fill(); ctx.restore();

  // bob & squash/stretch
  const bobY = p.onGround ? Math.sin(p.bob)*(p.running?6:3.5) : 0;
  const bobSq = p.onGround ? Math.sin(p.bob*2)*(p.running?0.05:0.025) : 0;
  const scaleY = 1 + bobSq;
  const scaleX = 1 / scaleY;

  ctx.save();
  ctx.translate(p.x-camX, p.y - CH/2 + bobY);
  if(p.facing===-1) ctx.scale(-1,1);
  ctx.drawImage(img, -CW*scaleX/2, -CH*scaleY/2, CW*scaleX, CH*scaleY);
  ctx.restore();
}

function loop(ts) {
  const dt = ts - lastT; lastT = ts;
  update(dt);
  ctx.clearRect(0,0,W,H);
  drawBG(ts);
  drawChar(ts);
  requestAnimationFrame(loop);
}

img.onload = () => requestAnimationFrame(ts => { lastT=ts; requestAnimationFrame(loop); });
img.onerror = () => { ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText('画像エラー',20,40); };
</script>
</body>
