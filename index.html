<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Momoshii Adventure</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body {
  width:100%; height:100%;
  background:#1a0a1e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-family:sans-serif; overflow:hidden;
  touch-action:none;
}
#wrap { display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; }
canvas { border-radius:12px; display:block; image-rendering:pixelated; max-width:100%; }
#hud {
  color:#ffaacc; font-size:12px; font-family:monospace;
  display:flex; gap:16px; opacity:0.8;
}
.kb { background:#3a1a3e; border:1px solid #ff88cc; border-radius:4px; padding:1px 6px; color:#ffccee; }

/* ── タッチUI ── */
#touch-ui {
  display:none;
  position:fixed; bottom:0; left:0; right:0;
  height:160px; pointer-events:none; z-index:10;
}
#dpad {
  position:absolute; bottom:20px; left:24px;
  width:130px; height:130px; pointer-events:all;
}
#btn-jump {
  position:absolute; bottom:28px; right:24px;
  width:72px; height:72px;
  background:radial-gradient(circle at 40% 35%,#ff88cc,#cc2277);
  border-radius:50%; border:3px solid #ffbbdd;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff; pointer-events:all;
  user-select:none; box-shadow:0 4px 16px #ff44aa88;
}
#btn-run {
  position:absolute; bottom:108px; right:110px;
  width:52px; height:52px;
  background:radial-gradient(circle at 40% 35%,#ffcc44,#cc8800);
  border-radius:50%; border:3px solid #ffeeaa;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; color:#fff; pointer-events:all;
  user-select:none; box-shadow:0 4px 12px #ffaa0088;
}
@media (pointer:coarse) {
  #touch-ui { display:block; }
  #hud { display:none; }
}
</style>
</head>

// D-pad
const dpadC=document.getElementById('dpad-c');
const dctx=dpadC.getContext('2d');
const DPAD_CX=65,DPAD_CY=65;
let dpadAngle=null,dpadActive=false,touchJump=false,touchRun=false;

function drawDpad(){
  dctx.clearRect(0,0,130,130);
  dctx.beginPath(); dctx.arc(DPAD_CX,DPAD_CY,63,0,Math.PI*2);
  dctx.fillStyle='rgba(255,150,200,0.15)'; dctx.fill();
  dctx.strokeStyle='rgba(255,150,200,0.4)'; dctx.lineWidth=2; dctx.stroke();
  [{a:0,l:'▶'},{a:Math.PI/2,l:'▼'},{a:Math.PI,l:'◀'},{a:-Math.PI/2,l:'▲'}].forEach(({a,l})=>{
    dctx.fillStyle='rgba(255,200,230,0.7)';
    dctx.font='13px sans-serif'; dctx.textAlign='center'; dctx.textBaseline='middle';
    dctx.fillText(l,DPAD_CX+Math.cos(a)*38,DPAD_CY+Math.sin(a)*38);
  });
  if(dpadActive&&dpadAngle!==null){
    const tx=DPAD_CX+Math.cos(dpadAngle)*26,ty=DPAD_CY+Math.sin(dpadAngle)*26;
    dctx.beginPath(); dctx.arc(tx,ty,16,0,Math.PI*2);
    dctx.fillStyle='rgba(255,100,180,0.75)'; dctx.fill();
  } else {
    dctx.beginPath(); dctx.arc(DPAD_CX,DPAD_CY,16,0,Math.PI*2);
    dctx.fillStyle='rgba(255,150,200,0.4)'; dctx.fill();
  }
}
drawDpad();

function getDpadAngle(touch,el){
  const r=el.getBoundingClientRect();
  const dx=touch.clientX-(r.left+r.width/2), dy=touch.clientY-(r.top+r.height/2);
  return Math.sqrt(dx*dx+dy*dy)<10?null:Math.atan2(dy,dx);
}
const dpadEl=document.getElementById('dpad');
dpadEl.addEventListener('touchstart',e=>{e.preventDefault();dpadActive=true;dpadAngle=getDpadAngle(e.touches[0],dpadEl);drawDpad();},{passive:false});
dpadEl.addEventListener('touchmove', e=>{e.preventDefault();dpadAngle=getDpadAngle(e.touches[0],dpadEl);drawDpad();},{passive:false});
dpadEl.addEventListener('touchend',  e=>{e.preventDefault();dpadActive=false;dpadAngle=null;drawDpad();},{passive:false});

const btnJump=document.getElementById('btn-jump');
btnJump.addEventListener('touchstart',e=>{e.preventDefault();touchJump=true;},{passive:false});
btnJump.addEventListener('touchend',  e=>{e.preventDefault();touchJump=false;},{passive:false});
const btnRun=document.getElementById('btn-run');
btnRun.addEventListener('touchstart',e=>{e.preventDefault();touchRun=true; btnRun.style.opacity='0.6';},{passive:false});
btnRun.addEventListener('touchend',  e=>{e.preventDefault();touchRun=false;btnRun.style.opacity='1';  },{passive:false});

function getGroundAt(x,fy){
  for(const pl of platforms)
    if(x>pl.x&&x<pl.x+pl.w&&fy>=pl.y&&fy<=pl.y+pl.h+10) return pl.y;
  return GROUND_Y;
}

let lastT=0, jumpPressed=false;

function update(dt){
  const run=touchRun||keys['ShiftLeft']||keys['ShiftRight'];
  const spd=run?5.5:3;
  let mx=0,my=0;
  if(keys['KeyA']||keys['ArrowLeft'])  mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  if(keys['KeyW']||keys['ArrowUp'])    my-=1;
  if(keys['KeyS']||keys['ArrowDown'])  my+=1;
  if(dpadActive&&dpadAngle!==null){
    mx+=Math.cos(dpadAngle); my+=Math.sin(dpadAngle);
    const l=Math.sqrt(mx*mx+my*my); if(l>1){mx/=l;my/=l;}
  }
  p.moving=Math.abs(mx)>0.1||Math.abs(my)>0.1;
  p.running=p.moving&&run;
  if(mx>0.1)p.facing=1; else if(mx<-0.1)p.facing=-1;
  p.vx=mx*spd;
  if(p.onGround)p.y+=my*spd*0.3;

  const wantJump=touchJump||keys['Space'];
  if(wantJump&&!jumpPressed&&p.onGround){
    p.vy=-9.5; p.onGround=false; p.bob=0;
  }
  jumpPressed=wantJump;

  // ふんわり重力
  p.vy+=0.3;
  if(p.vy<0)p.vy+=0.03;  // 上昇中は更に弱く

  p.x+=p.vx; p.y+=p.vy;
  const gnd=getGroundAt(p.x,p.y);
  if(p.y>=gnd){p.y=gnd;p.vy=0;p.onGround=true;}
  p.x=Math.max(CW/2,p.x);
  camX=Math.max(0,p.x-W*0.35);

  if(p.onGround&&p.moving)p.bob+=dt*(run?0.016:0.009);
  else if(p.onGround)p.bob+=dt*0.002;

  p.state=!p.onGround?'jump':p.running?'run':p.moving?'walk':'idle';
  const icons={idle:'♡',walk:'♪',run:'⚡',jump:'★'};
  if(st)st.textContent=(icons[p.state]||'♡')+' '+p.state.toUpperCase();
}

// ── 障害物描画 ───────────────────────────────
function drawMushroom(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*4);
  ctx.fillStyle='#ffe0cc'; ctx.fillRect(-6,0,12,14);
  ctx.fillStyle='#ff5577';
  ctx.beginPath(); ctx.ellipse(0,-4,13,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff8'; ctx.beginPath(); ctx.ellipse(-4,-6,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-4,2,2,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawStar(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*3);
  ctx.fillStyle='#ffee44'; ctx.rotate(Math.sin(t)*0.3);
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14);
    ctx.lineTo(Math.cos(a+Math.PI/5)*6,Math.sin(a+Math.PI/5)*6);
    ctx.lineTo(Math.cos(a+Math.PI*2/5)*14,Math.sin(a+Math.PI*2/5)*14);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawHeart(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t)*4);
  const s=1+Math.sin(t)*0.12; ctx.scale(s,s);
  ctx.fillStyle='#ff44aa';
  ctx.beginPath(); ctx.moveTo(0,4);
  ctx.bezierCurveTo(-14,-8,-20,10,0,20);
  ctx.bezierCurveTo(20,10,14,-8,0,4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBG(t){
  // 空グラデ（ピンク系）
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3d0a4e');
  g.addColorStop(0.45,'#5a1a6a');
  g.addColorStop(1,'#7a2a5a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // きらきらスパークル
  sparkles.forEach(s=>{
    s.phase+=s.spd;
    const sx=((s.x-camX*0.3)%W+W)%W;
    const al=0.3+Math.sin(s.phase)*0.4;
    ctx.fillStyle=`hsla(${s.hue},100%,85%,${al})`;
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
    // 十字光
    if(s.r>1.8){
      ctx.strokeStyle=`hsla(${s.hue},100%,90%,${al*0.5})`;
      ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(sx-s.r*2,s.y); ctx.lineTo(sx+s.r*2,s.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx,s.y-s.r*2); ctx.lineTo(sx,s.y+s.r*2); ctx.stroke();
    }
  });

  // 浮かぶハート
  hearts.forEach(h=>{
    h.phase+=0.02; h.y+=h.vy;
    if(h.y<-20)h.y=GROUND_Y;
    const hx=((h.x-camX*0.15)%W+W)%W;
    const al=h.alpha*(0.6+Math.sin(h.phase)*0.4);
    ctx.save(); ctx.globalAlpha=al;
    ctx.fillStyle='#ff88cc';
    ctx.translate(hx,h.y); ctx.scale(h.size/14,h.size/14);
    ctx.beginPath(); ctx.moveTo(0,4);
    ctx.bezierCurveTo(-10,-6,-14,8,0,16);
    ctx.bezierCurveTo(14,8,10,-6,0,4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  // 遠景の丘
  ctx.fillStyle='#4a0e66';
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y-15);
  for(let x=0;x<=W;x+=40){
    const hx=((x+camX*0.5)%400+400)%400;
    ctx.lineTo(x,GROUND_Y-15-Math.sin(hx/400*Math.PI*2)*40);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

  // 足場
  platforms.forEach(pl=>{
    const px=pl.x-camX;
    if(px>-pl.w&&px<W){
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(px+pl.w/2,pl.y+pl.h+5,pl.w/2,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=pl.color;
      ctx.beginPath(); ctx.roundRect(px,pl.y,pl.w,pl.h,6); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.roundRect(px+4,pl.y+2,pl.w-8,4,3); ctx.fill();
    }
  });

  // 地面
  const gg=ctx.createLinearGradient(0,GROUND_Y,0,H);
  gg.addColorStop(0,'#ff99cc'); gg.addColorStop(1,'#bb4488');
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,W,GROUND_H);
  // ハイライトライン
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y+1); ctx.lineTo(W,GROUND_Y+1); ctx.stroke();
  // 模様
  ctx.fillStyle='rgba(255,255,255,0.12)';
  for(let x=(((-camX*0.8)%40)+40)%40-40;x<W;x+=40){
    ctx.beginPath(); ctx.ellipse(x,GROUND_Y+8,11,4,0,0,Math.PI*2); ctx.fill();
  }

  // 障害物
  obstacles.forEach(ob=>{
    const ox=ob.x-camX;
    if(ox>-60&&ox<W+60){
      const ot=t*0.003+ob.phase;
      if(ob.type==='mushroom')drawMushroom(ox,ob.y,ot);
      else if(ob.type==='star')drawStar(ox,ob.y,ot);
      else drawHeart(ox,ob.y,ot);
    }
  });
}

function drawChar(){
  if(!img.complete||!img.naturalWidth)return;
  const gnd=getGroundAt(p.x,p.y);
  const dist=Math.max(0,gnd-p.y);
  const sa=Math.max(0.05,0.3-dist*0.003);
  const ss=Math.max(0.2,1-dist*0.007);
  ctx.save();
  ctx.fillStyle=`rgba(180,50,100,${sa})`;
  ctx.beginPath(); ctx.ellipse(p.x-camX,gnd+8,28*ss,7*ss,0,0,Math.PI*2);
  ctx.fill(); ctx.restore();

  const bobY=p.onGround?Math.sin(p.bob)*(p.running?6:3.5):0;
  const bobSq=p.onGround?Math.sin(p.bob*2)*(p.running?0.05:0.025):0;
  const scY=1+bobSq, scX=1/scY;

  ctx.save();
  ctx.translate(p.x-camX,p.y-CH/2+bobY);
  if(p.facing===-1)ctx.scale(-1,1);
  ctx.drawImage(img,-CW*scX/2,-CH*scY/2,CW*scX,CH*scY);
  ctx.restore();
}

function loop(ts){
  const dt=Math.min(ts-lastT,50); lastT=ts;
  update(dt);
  ctx.clearRect(0,0,W,H);
  drawBG(ts);
  drawChar();
  requestAnimationFrame(loop);
}
img.onload=()=>requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
img.onerror=()=>{ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('画像エラー',20,40);};
</script>
</body>
